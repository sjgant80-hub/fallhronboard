<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>◊ FallHROnboard · sovereign UK new starter onboarding · RTW · pension · contract</title>
<meta name="description" content="Sovereign UK new starter onboarding wizard. RTW (Immigration Act 2006), P45/starter checklist, bank for payroll, pension auto-enrolment, contract acceptance, GDPR Art.13 notice. Single HTML, IDB, MIT.">
<meta name="prime" content="1013">
<meta name="theme-color" content="#0b0a0f">
<link rel="manifest" href='data:application/manifest+json,{"name":"FallHROnboard","short_name":"hr-onboard","start_url":"./","display":"standalone","background_color":"%230b0a0f","theme_color":"%23b8974a","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27><rect width=%27192%27 height=%27192%27 fill=%27%230b0a0f%27 rx=%2728%27/><text x=%2796%27 y=%27140%27 font-family=%27Georgia, serif%27 font-size=%27122%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%23b8974a%27>%E2%97%8A</text></svg>","sizes":"192x192","type":"image/svg+xml"}]}'>
<style>
:root{--void:#0b0a0f;--void-2:#13121a;--ink:#1a1922;--line:#2a2934;--line-soft:#1f1e28;--cream:#e6e1d6;--cream-dim:#a8a395;--cream-muted:#6e6a5e;--brass:#b8974a;--amber:#ff8c00;--ox:#8b1a1a;--green:#4ade80;--red:#ef4444;--blue:#60a5fa;--yellow:#fbbf24;--serif:Georgia,'Libre Baskerville',ui-serif,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace}
*{margin:0;padding:0;box-sizing:border-box}html,body{background:var(--void);color:var(--cream);font:14px/1.55 var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;background:transparent;border:none;color:inherit}input,textarea,select{font-family:inherit;background:var(--ink);border:1px solid var(--line);color:var(--cream);border-radius:3px;padding:7px 10px;outline:none;font-size:13px}input:focus,textarea:focus,select:focus{border-color:var(--brass)}a{color:var(--brass)}
.app{min-height:100dvh;display:grid;grid-template-rows:48px 1fr}header{display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--void-2);user-select:none}.brand{display:flex;align-items:center;gap:10px;padding:0 16px;height:100%;border-right:1px solid var(--line)}.brand .mark{width:28px;height:28px;background:linear-gradient(135deg,var(--brass),var(--amber));border-radius:5px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--void)}.brand .name{font-family:var(--serif);font-weight:600;font-size:14px}.brand .seal{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.18em;text-transform:uppercase}
nav.tabs{display:flex;flex:1;overflow-x:auto;align-items:stretch}nav.tabs button{padding:0 14px;font-size:12px;color:var(--cream-dim);letter-spacing:0.04em;display:flex;align-items:center;border-right:1px solid var(--line-soft);height:100%;white-space:nowrap;border-top:2px solid transparent}nav.tabs button:hover{background:var(--ink);color:var(--cream)}nav.tabs button.active{background:var(--ink);color:var(--brass);border-top-color:var(--brass)}
.tools-r{display:flex;align-items:center;gap:5px;padding:0 14px;height:100%;border-left:1px solid var(--line)}.tool-btn{padding:5px 11px;border-radius:3px;font-size:11px;color:var(--cream-dim);letter-spacing:0.06em;text-transform:uppercase;font-family:var(--mono);border:1px solid var(--line)}.tool-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--brass)}
main{padding:18px 22px 60px;overflow-y:auto;max-width:900px;margin:0 auto;width:100%}
.disclaimer{background:rgba(139,26,26,0.15);border:1px solid var(--ox);border-left:3px solid var(--ox);border-radius:3px;padding:12px 16px;margin-bottom:18px;font-size:12px}.disclaimer strong{color:var(--brass)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:14px;flex-wrap:wrap}.section-h h2{font-family:var(--serif);font-size:18px;font-weight:600}.section-h .sub{font-family:var(--mono);font-size:11px;color:var(--cream-muted);letter-spacing:0.08em;text-transform:uppercase}.section-h .actions{display:flex;gap:6px}
.card{background:var(--void-2);border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:14px}.card h3{font-family:var(--serif);font-size:14px;font-weight:600;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}.field label{display:block;font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px}.field input,.field select,.field textarea{width:100%}.field .hint{font-size:10px;color:var(--cream-muted);margin-top:3px;font-family:var(--mono)}
.btn{padding:7px 14px;border:1px solid var(--brass);border-radius:3px;font-size:12px;color:var(--cream);background:transparent}.btn:hover{border-color:var(--amber);color:var(--amber)}.btn.brass{background:var(--brass);color:var(--void);border-color:var(--brass);font-weight:600}.btn.brass:hover{background:var(--amber)}.btn.sm{padding:4px 9px;font-size:11px}.btn.ghost{border-color:var(--line);color:var(--cream-dim)}.btn.danger:hover{border-color:var(--red);color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}th,td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}th{color:var(--brass);font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600}
.pill{display:inline-block;padding:2px 7px;border-radius:11px;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid var(--brass);color:var(--brass)}.pill.green{border-color:var(--green);color:var(--green)}.pill.red{border-color:var(--red);color:var(--red)}.pill.amber{border-color:var(--amber);color:var(--amber)}.pill.blue{border-color:var(--blue);color:var(--blue)}
.empty{padding:24px;text-align:center;color:var(--cream-muted);font-style:italic;font-size:12px}
.wizard-progress{display:flex;gap:4px;margin-bottom:18px}.wizard-progress .step{flex:1;height:4px;border-radius:2px;background:var(--line)}.wizard-progress .step.done{background:var(--green)}.wizard-progress .step.active{background:var(--brass)}
.step-card{background:var(--void-2);border:1px solid var(--line);border-radius:4px;padding:20px 22px;margin-bottom:14px}.step-card h3{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:4px}.step-card .step-sub{font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:14px}
.consent-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px}.consent-row input[type="checkbox"]{margin-top:3px;flex-shrink:0}.consent-row .label{font-weight:600}.consent-row .desc{font-size:11px;color:var(--cream-dim);margin-top:2px}
.nav-btns{display:flex;justify-content:space-between;margin-top:16px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding:6px}.msg{padding:10px 14px;border-radius:6px;max-width:88%;font-size:13px;line-height:1.55;white-space:pre-wrap}.msg.user{background:var(--ink);align-self:flex-end}.msg.bot{background:var(--void-2);border:1px solid var(--line);border-left:2px solid var(--brass);align-self:flex-start}.msg .src{font-family:var(--mono);font-size:10px;color:var(--cream-muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}.chat-input{display:flex;gap:8px;margin-top:10px}.chat-input input{flex:1;padding:11px 14px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;padding:18px;z-index:900;backdrop-filter:blur(4px)}.modal-bg.open{display:flex}.modal{background:var(--void-2);border:1px solid var(--brass);border-radius:4px;padding:22px;max-width:700px;width:100%;max-height:90vh;overflow:auto}.modal h2{font-family:var(--serif);font-size:17px;margin-bottom:14px}.modal .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brass);color:var(--void);padding:9px 18px;border-radius:3px;font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;opacity:0;transition:all 0.22s;z-index:1100;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){nav.tabs button{padding:0 10px;font-size:11px}main{padding:14px 14px 50px}.row,.row3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="mark">◊</div><div><div class="name">FallHROnboard</div></div><div class="seal">v1 · prime 1013</div></div>
  <nav class="tabs" id="tabNav"></nav>
  <div class="tools-r"><button class="tool-btn" id="tierBadge" onclick="openModal('settings')">T0</button><button class="tool-btn" onclick="openModal('settings')">⚙</button></div>
</header>
<main id="view"></main>
</div>
<div class="modal-bg" id="modal"><div class="modal"><h2 id="modalTitle">.</h2><div id="modalBody"></div></div></div>
<div class="toast" id="toast">.</div>

<script>
'use strict';
const TOOLNAME='fallhronboard',VERSION='1.0.0',PRIME=1013,STORE='fallhronboard-v1';
const TABS=[{id:'register',label:'new starter'},{id:'starters',label:'starters'},{id:'qa',label:'Q&A'}];

function newStarterRec(){return{id:'',
  personal:{title:'',firstName:'',lastName:'',preferredName:'',dob:'',niNumber:'',address:'',email:'',phone:'',emergencyName:'',emergencyPhone:'',emergencyRelationship:''},
  job:{jobTitle:'',department:'',startDate:'',contractType:'permanent full-time',hoursPerWeek:'37.5',salary:'',probationMonths:'6',reportingTo:''},
  rtw:{verified:false,docType:'',docRef:'',verifyDate:'',expiryDate:'',shareCode:''},
  starter:{p45:false,starterDeclaration:'A',studentLoan:false,studentLoanPlan:'',postgraduateLoan:false},
  bank:{accountName:'',sortCode:'',accountNo:'',buildingSocietyRoll:''},
  pension:{autoEnrolEligible:false,optOut:false,employeeContrib:'5',employerContrib:'3',provider:''},
  consent:{gdprPrivacy:false,disciplinary:false,grievance:false,equality:false,healthSafety:false,contractAccept:false,s1Statement:false},
  status:'new',ts:0}}

let state={active:'register',firm:null,starters:[],audit:[],
  ui:{wizardStep:0,wizardData:null,chat:[]},
  settings:{anthropicKey:'',auditChain:true}};

const $=(s,p=document)=>p.querySelector(s);const uid=p=>(p||'')+'_'+Math.random().toString(36).slice(2,11);const now=()=>Date.now();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateStr=ts=>{if(!ts)return '—';return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),1900)}
async function sha256(s){const buf=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}

let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(STORE,1);r.onupgradeneeded=e=>{const d=e.target.result;['state','audit','firms','starters'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='state'?undefined:'id'})})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=rej})}
function idbGetAll(s){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}
function idbGet(s,k){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}
function idbPut(s,v,k){return new Promise(res=>{const tx=db.transaction(s,'readwrite');const o=tx.objectStore(s);const q=k!=null?o.put(v,k):o.put(v);q.onsuccess=()=>res(true);q.onerror=()=>res(false)})}
async function loadAll(){if(!db)await openDB();const[firms,starters,auditArr,uiState]=await Promise.all([idbGetAll('firms'),idbGetAll('starters'),idbGetAll('audit'),idbGet('state','ui')]);state.firm=firms[0]||null;state.starters=starters;state.audit=auditArr.sort((a,b)=>a.i-b.i);if(uiState){state.ui=Object.assign({},state.ui,uiState.value||{});state.settings=Object.assign({},state.settings,uiState.settings||{})}}
async function persistUI(){await idbPut('state',{value:{...state.ui},settings:state.settings},'ui')}
async function auditLog(action,opts={}){if(!state.settings.auditChain)return;const prev=state.audit.length?state.audit[state.audit.length-1]:null;const i=(prev?prev.i:0)+1;const entry={id:uid('au'),i,ts:now(),tool:TOOLNAME,action,reasoning:opts.reasoning||'',configVersion:TOOLNAME+'@'+VERSION,prevHash:prev?.docHash||'',docHash:'',payload:opts.payload||{}};entry.docHash=await sha256(JSON.stringify({i,ts:entry.ts,action,prevHash:entry.prevHash,payload:entry.payload}));state.audit.push(entry);await idbPut('audit',entry)}

let bcHr,bcSignal;
function initMesh(){try{bcSignal=new BroadcastChannel('fall-signal');bcSignal.postMessage({source:TOOLNAME,type:'hello',prime:PRIME,version:VERSION,ts:now()})}catch(e){}try{bcHr=new BroadcastChannel('fall-hr');bcHr.addEventListener('message',e=>{const m=e.data;if(!m||m.source===TOOLNAME)return;if(m.type==='sync.request'){bcHr.postMessage({v:1,type:'sync.snapshot',ts:now(),source:TOOLNAME,payload:{starters:state.starters,firm:state.firm}})}});bcHr.postMessage({v:1,type:'sync.request',ts:now(),source:TOOLNAME})}catch(e){}}

const STEPS=[
  {id:'personal',name:'Personal Details',sub:'Name, contact, NI number, DOB'},
  {id:'job',name:'Job Details',sub:'Role, start date, hours, salary, probation'},
  {id:'rtw',name:'Right to Work',sub:'Immigration Act 2006 · verify before day 1'},
  {id:'starter',name:'Starter Declaration',sub:'HMRC P45 or starter checklist · tax code'},
  {id:'bank',name:'Bank Details',sub:'For payroll · sort code, account no'},
  {id:'pension',name:'Pension Auto-Enrolment',sub:'Pensions Act 2008 · 22+ earning £10k+'},
  {id:'consent',name:'Policies & Consent',sub:'GDPR Art.13, disciplinary, equality, contract'},
];

function render(){$('#tabNav').innerHTML=TABS.map(t=>`<button class="${state.active===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('');const v=$('#view');switch(state.active){case 'register':return renderRegister(v);case 'starters':return renderStarters(v);case 'qa':return renderQA(v)}}
function switchTab(id){state.active=id;persistUI();render()}

function renderRegister(v){
  const step=state.ui.wizardStep||0;
  if(!state.ui.wizardData)state.ui.wizardData=newStarterRec();
  const d=state.ui.wizardData;
  v.innerHTML=`<div class="disclaimer"><strong>◊ Regulatory notice:</strong> New starter onboarding per Employment Rights Act 1996 (S.1 statement day-one), Immigration, Asylum and Nationality Act 2006 (RTW), Pensions Act 2008 (auto-enrolment), UK GDPR Art.13 (privacy notice), ACAS Code. All data stored locally.</div><div class="section-h"><h2>New Starter</h2></div><div class="wizard-progress">${STEPS.map((_,i)=>`<div class="step ${i<step?'done':i===step?'active':''}"></div>`).join('')}</div>`;
  const s=STEPS[step];
  v.innerHTML+=`<div class="step-card"><h3>${esc(s.name)}</h3><div class="step-sub">Step ${step+1} of ${STEPS.length} · ${esc(s.sub)}</div><div id="stepBody"></div><div class="nav-btns"><button class="btn ghost" ${step===0?'disabled':''} onclick="prevStep()">Back</button>${step<STEPS.length-1?`<button class="btn brass" onclick="nextStep()">Next</button>`:`<button class="btn brass" onclick="submitReg()">Submit</button>`}</div></div>`;
  renderStepBody(s.id,d);
}
function prevStep(){collectStep();state.ui.wizardStep=Math.max(0,state.ui.wizardStep-1);persistUI();render()}
function nextStep(){collectStep();state.ui.wizardStep=Math.min(STEPS.length-1,state.ui.wizardStep+1);persistUI();render()}

function renderStepBody(stepId,d){const body=$('#stepBody');if(!body)return;
  if(stepId==='personal')body.innerHTML=`<div class="row3"><div class="field"><label>Title</label><select id="wTitle"><option ${d.personal.title==='Mr'?'selected':''}>Mr</option><option ${d.personal.title==='Mrs'?'selected':''}>Mrs</option><option ${d.personal.title==='Ms'?'selected':''}>Ms</option><option ${d.personal.title==='Miss'?'selected':''}>Miss</option><option ${d.personal.title==='Mx'?'selected':''}>Mx</option><option ${d.personal.title==='Dr'?'selected':''}>Dr</option></select></div><div class="field"><label>First name</label><input id="wFirst" value="${esc(d.personal.firstName)}"></div><div class="field"><label>Last name</label><input id="wLast" value="${esc(d.personal.lastName)}"></div></div><div class="row"><div class="field"><label>Preferred name</label><input id="wPref" value="${esc(d.personal.preferredName)}"></div><div class="field"><label>Date of birth</label><input type="date" id="wDob" value="${esc(d.personal.dob)}"></div></div><div class="row"><div class="field"><label>NI number</label><input id="wNi" value="${esc(d.personal.niNumber)}" placeholder="AB123456C"><div class="hint">Required for RTI submission</div></div><div class="field"><label>Email</label><input id="wEmail" value="${esc(d.personal.email)}"></div></div><div class="field"><label>Home address</label><input id="wAddr" value="${esc(d.personal.address)}"></div><div class="field"><label>Phone</label><input id="wPhone" value="${esc(d.personal.phone)}"></div><div class="card" style="margin-top:14px"><h3>Emergency contact</h3><div class="row3"><div class="field"><label>Name</label><input id="wEmName" value="${esc(d.personal.emergencyName)}"></div><div class="field"><label>Phone</label><input id="wEmPhone" value="${esc(d.personal.emergencyPhone)}"></div><div class="field"><label>Relationship</label><input id="wEmRel" value="${esc(d.personal.emergencyRelationship)}"></div></div></div>`;
  else if(stepId==='job')body.innerHTML=`<div class="row"><div class="field"><label>Job title</label><input id="wTitle" value="${esc(d.job.jobTitle)}"></div><div class="field"><label>Department</label><input id="wDept" value="${esc(d.job.department)}"></div></div><div class="row"><div class="field"><label>Start date</label><input type="date" id="wStart" value="${esc(d.job.startDate)}"></div><div class="field"><label>Contract type</label><select id="wCType"><option ${d.job.contractType==='permanent full-time'?'selected':''}>permanent full-time</option><option ${d.job.contractType==='permanent part-time'?'selected':''}>permanent part-time</option><option ${d.job.contractType==='fixed-term'?'selected':''}>fixed-term</option><option ${d.job.contractType==='zero-hours'?'selected':''}>zero-hours</option><option ${d.job.contractType==='casual'?'selected':''}>casual</option><option ${d.job.contractType==='apprenticeship'?'selected':''}>apprenticeship</option></select></div></div><div class="row"><div class="field"><label>Hours per week</label><input type="number" step="0.5" id="wHrs" value="${esc(d.job.hoursPerWeek)}"></div><div class="field"><label>Salary £/yr</label><input type="number" id="wSal" value="${esc(d.job.salary)}"></div></div><div class="row"><div class="field"><label>Probation period (months)</label><input type="number" id="wProb" value="${esc(d.job.probationMonths)}"></div><div class="field"><label>Reporting to</label><input id="wReport" value="${esc(d.job.reportingTo)}"></div></div>`;
  else if(stepId==='rtw')body.innerHTML=`<div class="card" style="border-color:var(--ox);margin-bottom:12px"><p style="font-size:12px;color:var(--cream-dim);line-height:1.6"><strong style="color:var(--brass)">Immigration, Asylum and Nationality Act 2006:</strong> Verify Right to Work BEFORE the start date. Retain copies for duration of employment + 2 years. Civil penalty up to £45,000 per illegal worker (Feb 2024).</p></div><div class="row"><div class="field"><label>Document type</label><select id="wRtwDoc"><option value="" ${!d.rtw.docType?'selected':''}>— select —</option><option ${d.rtw.docType==='UK passport'?'selected':''}>UK passport</option><option ${d.rtw.docType==='Irish passport'?'selected':''}>Irish passport</option><option ${d.rtw.docType==='Share code (gov.uk)'?'selected':''}>Share code (gov.uk)</option><option ${d.rtw.docType==='BRP'?'selected':''}>BRP</option><option ${d.rtw.docType==='Visa'?'selected':''}>Visa</option><option ${d.rtw.docType==='UK birth certificate + NI'?'selected':''}>UK birth certificate + NI</option></select></div><div class="field"><label>Document ref / share code</label><input id="wRtwRef" value="${esc(d.rtw.docRef)}"></div></div><div class="row"><div class="field"><label>Verification date</label><input type="date" id="wRtwDate" value="${esc(d.rtw.verifyDate)}"></div><div class="field"><label>Expiry date (if visa)</label><input type="date" id="wRtwExp" value="${esc(d.rtw.expiryDate)}"></div></div><div class="consent-row"><input type="checkbox" id="wRtwVerified" ${d.rtw.verified?'checked':''}><div><div class="label">I confirm I have seen and verified the original document(s)</div><div class="desc">Copies retained per Immigration Act 2006 requirements</div></div></div>`;
  else if(stepId==='starter')body.innerHTML=`<div class="card" style="border-color:var(--ox);margin-bottom:12px"><p style="font-size:12px;color:var(--cream-dim);line-height:1.6"><strong style="color:var(--brass)">HMRC Starter Information:</strong> If the new starter has a P45 from previous employment use that. Otherwise complete the Starter Checklist (formerly P46) and select declaration A, B, or C. This determines initial tax code.</p></div><div class="consent-row"><input type="checkbox" id="wP45" ${d.starter.p45?'checked':''}><div><div class="label">P45 received from previous employer</div><div class="desc">Parts 2 and 3 only. Keep Part 3 for HMRC submission.</div></div></div><div class="field"><label>Starter declaration (if no P45)</label><select id="wDecl"><option value="A" ${d.starter.starterDeclaration==='A'?'selected':''}>A — This is my first job since 6 April and I've not received SP/JSA/ESA/IIDB</option><option value="B" ${d.starter.starterDeclaration==='B'?'selected':''}>B — This is my only job, but since 6 April I've had another, or received SP/JSA/ESA/IIDB</option><option value="C" ${d.starter.starterDeclaration==='C'?'selected':''}>C — I have another job or receive a State or Occupational Pension</option></select><div class="hint">A → 1257L · B → 1257L W1/M1 · C → BR cumulative</div></div><div class="card" style="margin-top:14px"><h3>Student loans</h3><div class="consent-row"><input type="checkbox" id="wSL" ${d.starter.studentLoan?'checked':''}><div><div class="label">Has outstanding undergraduate student loan</div></div></div><div class="field" style="margin-top:8px"><label>Plan type</label><select id="wSLP"><option value="" ${!d.starter.studentLoanPlan?'selected':''}>— select —</option><option ${d.starter.studentLoanPlan==='1'?'selected':''}>Plan 1 (pre-2012 England/Wales, all NI/Scotland)</option><option ${d.starter.studentLoanPlan==='2'?'selected':''}>Plan 2 (2012+ England/Wales)</option><option ${d.starter.studentLoanPlan==='4'?'selected':''}>Plan 4 (Scotland 2021+)</option><option ${d.starter.studentLoanPlan==='5'?'selected':''}>Plan 5 (England 2023+)</option></select></div><div class="consent-row"><input type="checkbox" id="wPGL" ${d.starter.postgraduateLoan?'checked':''}><div><div class="label">Has postgraduate loan (PGL)</div><div class="desc">Separate from undergraduate. Different threshold (£21,000).</div></div></div></div>`;
  else if(stepId==='bank')body.innerHTML=`<div class="row"><div class="field"><label>Account holder name</label><input id="wBName" value="${esc(d.bank.accountName)}"></div><div class="field"><label>Sort code</label><input id="wBSort" value="${esc(d.bank.sortCode)}" placeholder="12-34-56"></div></div><div class="row"><div class="field"><label>Account number</label><input id="wBAcc" value="${esc(d.bank.accountNo)}" placeholder="12345678"></div><div class="field"><label>Building Society roll no (if applicable)</label><input id="wBRoll" value="${esc(d.bank.buildingSocietyRoll)}"></div></div><div class="card" style="margin-top:14px;font-size:12px;color:var(--cream-dim);line-height:1.55"><strong style="color:var(--brass)">Note:</strong> Bank details are required for BACS payroll. Verify with the employee (small test transfer recommended for first pay run). Store securely per UK GDPR Art.32.</div>`;
  else if(stepId==='pension')body.innerHTML=`<div class="card" style="border-color:var(--ox);margin-bottom:12px"><p style="font-size:12px;color:var(--cream-dim);line-height:1.6"><strong style="color:var(--brass)">Pensions Act 2008 auto-enrolment:</strong> Eligible jobholders (age 22 to State Pension Age, earning over £10,000/year in the pay reference period) must be automatically enrolled. Minimum contributions: employer 3%, employee 5%, total 8% (since April 2019).</p></div><div class="consent-row"><input type="checkbox" id="wAE" ${d.pension.autoEnrolEligible?'checked':''}><div><div class="label">Eligible jobholder (22+ earning £10k+)</div><div class="desc">If yes, must be auto-enrolled within 3 months of start date</div></div></div><div class="consent-row"><input type="checkbox" id="wOO" ${d.pension.optOut?'checked':''}><div><div class="label">Employee has opted out</div><div class="desc">Opt-out within 1 month for full refund. Must be re-enrolled every 3 years.</div></div></div><div class="row" style="margin-top:8px"><div class="field"><label>Employee contribution %</label><input type="number" step="0.1" id="wEmpC" value="${esc(d.pension.employeeContrib)}"></div><div class="field"><label>Employer contribution %</label><input type="number" step="0.1" id="wErC" value="${esc(d.pension.employerContrib)}"></div></div><div class="field"><label>Pension provider</label><input id="wProv" value="${esc(d.pension.provider)}" placeholder="e.g. Nest, Smart Pension, Aviva, The People's Pension"></div>`;
  else if(stepId==='consent')body.innerHTML=`<div class="consent-row"><input type="checkbox" id="wGdpr" ${d.consent.gdprPrivacy?'checked':''}><div><div class="label">UK GDPR Article 13 privacy notice provided</div><div class="desc">Identity of controller, lawful basis (contract Art.6(1)(b) + legitimate interest), retention periods, employee rights, ICO contact details.</div></div></div><div class="consent-row"><input type="checkbox" id="wDisc" ${d.consent.disciplinary?'checked':''}><div><div class="label">Disciplinary procedure issued (ACAS Code)</div><div class="desc">ACAS Code of Practice on Disciplinary and Grievance Procedures. Tribunal uplift up to 25% if not followed.</div></div></div><div class="consent-row"><input type="checkbox" id="wGriev" ${d.consent.grievance?'checked':''}><div><div class="label">Grievance procedure issued</div><div class="desc">Written procedure, accessible, employee informed during induction.</div></div></div><div class="consent-row"><input type="checkbox" id="wEqual" ${d.consent.equality?'checked':''}><div><div class="label">Equality, diversity & anti-harassment policy issued</div><div class="desc">Equality Act 2010 · Worker Protection (Amendment) Act 2023 — positive duty to prevent sexual harassment from 26 Oct 2024.</div></div></div><div class="consent-row"><input type="checkbox" id="wHS" ${d.consent.healthSafety?'checked':''}><div><div class="label">Health & Safety policy issued + induction completed</div><div class="desc">Required if 5+ employees (HSWA 1974). Risk assessments shared.</div></div></div><div class="consent-row"><input type="checkbox" id="wS1" ${d.consent.s1Statement?'checked':''}><div><div class="label">S.1 written statement of particulars issued (DAY 1)</div><div class="desc">ERA 1996 s.1. Day-one right since 6 Apr 2020. Tribunal award 2-4 weeks pay if missing.</div></div></div><div class="consent-row"><input type="checkbox" id="wContract" ${d.consent.contractAccept?'checked':''}><div><div class="label">Contract of employment signed and accepted</div><div class="desc">Generate from FallHRPaper. Two copies — one for employee, one for personnel file.</div></div></div>`;
}
function collectStep(){const step=STEPS[state.ui.wizardStep];const d=state.ui.wizardData;if(!step||!d)return;
  if(step.id==='personal'){d.personal.title=$('#wTitle')?.value||d.personal.title;d.personal.firstName=$('#wFirst')?.value?.trim()||d.personal.firstName;d.personal.lastName=$('#wLast')?.value?.trim()||d.personal.lastName;d.personal.preferredName=$('#wPref')?.value?.trim()||d.personal.preferredName;d.personal.dob=$('#wDob')?.value||d.personal.dob;d.personal.niNumber=$('#wNi')?.value?.trim()||d.personal.niNumber;d.personal.email=$('#wEmail')?.value?.trim()||d.personal.email;d.personal.address=$('#wAddr')?.value?.trim()||d.personal.address;d.personal.phone=$('#wPhone')?.value?.trim()||d.personal.phone;d.personal.emergencyName=$('#wEmName')?.value?.trim()||d.personal.emergencyName;d.personal.emergencyPhone=$('#wEmPhone')?.value?.trim()||d.personal.emergencyPhone;d.personal.emergencyRelationship=$('#wEmRel')?.value?.trim()||d.personal.emergencyRelationship}
  else if(step.id==='job'){d.job.jobTitle=$('#wTitle')?.value?.trim()||d.job.jobTitle;d.job.department=$('#wDept')?.value?.trim()||d.job.department;d.job.startDate=$('#wStart')?.value||d.job.startDate;d.job.contractType=$('#wCType')?.value||d.job.contractType;d.job.hoursPerWeek=$('#wHrs')?.value||d.job.hoursPerWeek;d.job.salary=$('#wSal')?.value||d.job.salary;d.job.probationMonths=$('#wProb')?.value||d.job.probationMonths;d.job.reportingTo=$('#wReport')?.value?.trim()||d.job.reportingTo}
  else if(step.id==='rtw'){d.rtw.docType=$('#wRtwDoc')?.value||d.rtw.docType;d.rtw.docRef=$('#wRtwRef')?.value?.trim()||d.rtw.docRef;d.rtw.verifyDate=$('#wRtwDate')?.value||d.rtw.verifyDate;d.rtw.expiryDate=$('#wRtwExp')?.value||d.rtw.expiryDate;d.rtw.verified=$('#wRtwVerified')?.checked||false}
  else if(step.id==='starter'){d.starter.p45=$('#wP45')?.checked||false;d.starter.starterDeclaration=$('#wDecl')?.value||d.starter.starterDeclaration;d.starter.studentLoan=$('#wSL')?.checked||false;d.starter.studentLoanPlan=$('#wSLP')?.value||d.starter.studentLoanPlan;d.starter.postgraduateLoan=$('#wPGL')?.checked||false}
  else if(step.id==='bank'){d.bank.accountName=$('#wBName')?.value?.trim()||d.bank.accountName;d.bank.sortCode=$('#wBSort')?.value?.trim()||d.bank.sortCode;d.bank.accountNo=$('#wBAcc')?.value?.trim()||d.bank.accountNo;d.bank.buildingSocietyRoll=$('#wBRoll')?.value?.trim()||d.bank.buildingSocietyRoll}
  else if(step.id==='pension'){d.pension.autoEnrolEligible=$('#wAE')?.checked||false;d.pension.optOut=$('#wOO')?.checked||false;d.pension.employeeContrib=$('#wEmpC')?.value||d.pension.employeeContrib;d.pension.employerContrib=$('#wErC')?.value||d.pension.employerContrib;d.pension.provider=$('#wProv')?.value?.trim()||d.pension.provider}
  else if(step.id==='consent'){d.consent.gdprPrivacy=$('#wGdpr')?.checked||false;d.consent.disciplinary=$('#wDisc')?.checked||false;d.consent.grievance=$('#wGriev')?.checked||false;d.consent.equality=$('#wEqual')?.checked||false;d.consent.healthSafety=$('#wHS')?.checked||false;d.consent.s1Statement=$('#wS1')?.checked||false;d.consent.contractAccept=$('#wContract')?.checked||false}
}
async function submitReg(){collectStep();const d=state.ui.wizardData;d.id=uid('st');d.ts=now();d.status='complete';state.starters.push(d);await idbPut('starters',d);try{bcHr?.postMessage({v:1,type:'sync.snapshot',ts:now(),source:TOOLNAME,payload:{starters:[d]}})}catch(_){}await auditLog('starter.completed',{payload:{id:d.id,name:d.personal.firstName+' '+d.personal.lastName}});state.ui.wizardStep=0;state.ui.wizardData=null;persistUI();toast('Onboarded');render()}

function renderStarters(v){v.innerHTML=`<div class="section-h"><h2>Starters</h2><div class="sub">${state.starters.length}</div></div>${state.starters.length?`<table><thead><tr><th>Name</th><th>Job title</th><th>Start date</th><th>RTW</th><th>Pension</th><th>S.1</th><th>Contract</th><th>Status</th></tr></thead><tbody>${state.starters.sort((a,b)=>(b.ts||0)-(a.ts||0)).map(s=>`<tr><td><strong>${esc(s.personal.firstName)} ${esc(s.personal.lastName)}</strong></td><td>${esc(s.job.jobTitle)}</td><td>${esc(s.job.startDate)}</td><td><span class="pill ${s.rtw?.verified?'green':'red'}">${s.rtw?.verified?'✓':'✗'}</span></td><td><span class="pill ${s.pension?.autoEnrolEligible?(s.pension.optOut?'amber':'green'):'blue'}">${s.pension?.autoEnrolEligible?(s.pension.optOut?'opted out':'enrolled'):'not eligible'}</span></td><td><span class="pill ${s.consent?.s1Statement?'green':'red'}">${s.consent?.s1Statement?'✓':'✗'}</span></td><td><span class="pill ${s.consent?.contractAccept?'green':'red'}">${s.consent?.contractAccept?'✓':'✗'}</span></td><td><span class="pill ${s.status==='complete'?'green':'amber'}">${s.status}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No starters yet.</div>'}`}

const T0_QA=[
  {q:/p45|p46|starter.?checklist|declaration/i,a:'HMRC Starter Information: If new starter has P45 from previous employer, use Parts 2 and 3 (employer keeps Part 3 for RTI). If no P45, complete Starter Checklist (formerly P46) — pick declaration A, B, or C. A = first job since 6 April, no benefits → tax code 1257L cumulative. B = had another job OR benefits since 6 April → 1257L W1/M1 (non-cumulative). C = has another job or pension → BR (basic rate on all earnings). Submit via first FPS.'},
  {q:/student.?loan|plan.?1|plan.?2|plan.?4|plan.?5|pgl/i,a:'Student Loan repayment plans (2024/25 thresholds): Plan 1 — £24,990 threshold, 9% above (pre-2012 England/Wales + all NI/Scotland). Plan 2 — £27,295 (2012+ England/Wales). Plan 4 — £31,395 (Scotland 2021+). Plan 5 — £25,000 (England 2023+). Postgraduate Loan (PGL) — £21,000 threshold, 6%. Multiple plans possible. Set in payroll software; deducted via PAYE.'},
  {q:/rtw|right.?to.?work|immigration|passport|visa|share.?code/i,a:'Immigration, Asylum and Nationality Act 2006: verify Right to Work BEFORE start date. Documents: UK/Irish passport, gov.uk share code (online check for non-UK nationals), BRP, visa. Manual: original docs in person. Online: share code on gov.uk. Keep copies duration + 2 years. Penalty: up to £45,000/illegal worker (Feb 2024). Repeat: criminal prosecution. Employer is responsible for the check.'},
  {q:/pension|auto.?enrol|nest|opt.?out|3.?year/i,a:'Pensions Act 2008 auto-enrolment: eligible jobholders (age 22 to SPA, earning £10,000+ in pay reference period) must be auto-enrolled within 3 months of start date. Min contributions: employer 3%, employee 5% (since 6 Apr 2019). Earnings band £6,240-£50,270 for calculation (2024/25). Opt-out window: 1 month for full refund. Re-enrol every 3 years (cyclical re-enrolment). TPR enforcement: fixed penalty £400, escalating £50-£10k/day.'},
  {q:/s\.?1|day.?one|statement.?of.?particulars|written.?statement/i,a:'Employment Rights Act 1996 s.1: written statement of particulars to ALL workers (not just employees) on or before day one of work — since 6 Apr 2020 (previously 2 months). Must include: parties, start date, pay, hours, holiday, sick pay, notice, location, job title/description, probation, training, benefits, disciplinary/grievance procedure. Failure: tribunal award 2-4 weeks pay (Employment Act 2002 s.38) when claim succeeds on another matter.'},
  {q:/gdpr|privacy|article 13|data.?protection/i,a:'UK GDPR Article 13 privacy notice (employee): provide at point of collection. Must include: identity/contact of controller, DPO if appointed, purposes + lawful basis (typically Art.6(1)(b) contract + legitimate interest Art.6(1)(f) for things like CCTV), recipients, retention periods, employee rights (access, rectification, erasure, restriction, portability, objection), right to complain to ICO, source if not from employee. ICO registration required if processing personal data.'},
  {q:/probation|notice.?period|fair.?dismissal/i,a:'Probation: not statutory but common (3-6 months typical, max 9). Shorter notice during probation (often 1 week). Employer must still follow ACAS Code for any dismissal even in probation. After 2 years service, unfair dismissal protection applies — must have fair reason (capability/conduct/redundancy/illegality/SOSR) AND fair procedure. Notice: statutory min 1 week for service 1mo-2yr, then 1 week/year up to 12 weeks max. Contract may give longer.'},
  {q:/bank|payroll|bacs|sort.?code/i,a:'Payroll bank details: account holder name, sort code (XX-XX-XX), 8-digit account number. Building society: add roll number. Verify with employee (modulus check fails common). First pay: BACS 3-day clearing (Bacs Direct Credit). Faster Payments instant. Store per UK GDPR Art.32 (technical and organisational security). Restrict access. Encrypt if sharing with payroll bureau.'},
];
function askT0(q){for(const r of T0_QA){if(r.q.test(q))return {answer:r.a,source:'T0 · UK HR rules'}}return null}
async function askT3(q){if(!state.settings.anthropicKey)return null;try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':state.settings.anthropicKey,'anthropic-version':'2023-06-01','content-type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:'You are a UK HR onboarding expert. ERA 1996, Pensions Act 2008, RTW (Immigration Act 2006), HMRC PAYE starter information, GDPR. Concise.\n\n'+q}]})});if(!res.ok)return null;const j=await res.json();return {answer:j.content?.[0]?.text,source:'T3 · Anthropic'}}catch(e){return null}}
function renderQA(v){v.innerHTML=`<div class="section-h"><h2>Q & A</h2><div class="sub">T0 + T3 BYOK</div></div><div class="card" style="max-width:780px"><div class="chat" id="chatBox">${(state.ui.chat||[]).map(m=>`<div class="msg ${m.role}">${esc(m.text)}${m.source?`<div class="src">${esc(m.source)}</div>`:''}</div>`).join('')}</div><div class="chat-input"><input id="chatIn" placeholder="Ask… 'starter declaration A vs B?' · 'auto-enrolment thresholds?' · 'S.1 deadline?'" onkeydown="if(event.key==='Enter')askQ()"><button class="btn brass" onclick="askQ()">Ask</button></div></div>`;const box=$('#chatBox');if(box)box.scrollTop=box.scrollHeight}
async function askQ(){const inp=$('#chatIn');if(!inp)return;const q=inp.value.trim();if(!q)return;inp.value='';if(!state.ui.chat)state.ui.chat=[];state.ui.chat.push({role:'user',text:q});render();let r=askT0(q);if(!r)r=await askT3(q);state.ui.chat.push(r?{role:'bot',text:r.answer,source:r.source}:{role:'bot',text:'No T0 match. Add BYOK key for T3.',source:'system'});persistUI();render()}

function openModal(type){const modal=$('#modal');$('#modalTitle').textContent='Settings';modal.classList.add('open');$('#modalBody').innerHTML=`<div class="field"><label>Firm name</label><input id="fName" value="${esc(state.firm?.name||'')}"></div><div class="field"><label>Anthropic key (T3)</label><input type="password" id="sKey" value="${esc(state.settings.anthropicKey||'')}"></div><div style="margin:10px 0"><label style="font-size:12px"><input type="checkbox" id="sAudit" ${state.settings.auditChain?'checked':''}> Audit chain</label></div><div class="actions"><button class="btn ghost sm" onclick="exportAll()">Export</button><button class="btn ghost sm" onclick="importAll()">Import</button><button class="btn danger sm" onclick="wipeAll()">Wipe</button><button class="btn brass" onclick="saveSettings()">Save</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}
function closeModal(){$('#modal').classList.remove('open')}
async function saveSettings(){const f=state.firm||{id:uid('fi'),ts:now()};f.name=$('#fName').value.trim();f.updatedAt=now();state.firm=f;await idbPut('firms',f);state.settings.anthropicKey=$('#sKey').value.trim();state.settings.auditChain=$('#sAudit').checked;$('#tierBadge').textContent=state.settings.anthropicKey?'T3':'T0';await persistUI();closeModal();toast('Saved');render()}
function exportAll(){const d={tool:TOOLNAME,v:VERSION,ts:now(),firm:state.firm,starters:state.starters};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='fallhronboard-export.json';a.click();URL.revokeObjectURL(u);toast('Exported')}
function importAll(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(Array.isArray(d.starters))for(const r of d.starters){state.starters.push(r);await idbPut('starters',r)}persistUI();toast('Imported');render()}catch(e){toast('Failed')}};inp.click()}
async function wipeAll(){if(!confirm('Wipe ALL data?'))return;for(const s of['firms','starters','audit','state']){const tx=db.transaction(s,'readwrite');tx.objectStore(s).clear();await new Promise(r=>{tx.oncomplete=r})}location.reload()}

async function seedDemo(){if(state.starters.length)return;
  const s1={id:uid('st'),personal:{title:'Mr',firstName:'Tariq',lastName:'Hassan',preferredName:'',dob:'1995-03-14',niNumber:'AB123456C',address:'42 Bridge Street, Manchester M3 4AA',email:'t.hassan@example.com',phone:'07700 900555',emergencyName:'Amira Hassan',emergencyPhone:'07700 900556',emergencyRelationship:'Wife'},
  job:{jobTitle:'Junior Developer',department:'Engineering',startDate:'2026-07-01',contractType:'permanent full-time',hoursPerWeek:'37.5',salary:'42000',probationMonths:'6',reportingTo:'Adam Ross'},
  rtw:{verified:true,docType:'UK passport',docRef:'GBR-87654321',verifyDate:'2026-06-15',expiryDate:''},
  starter:{p45:true,starterDeclaration:'A',studentLoan:true,studentLoanPlan:'2',postgraduateLoan:false},
  bank:{accountName:'Mr T Hassan',sortCode:'12-34-56',accountNo:'12345678',buildingSocietyRoll:''},
  pension:{autoEnrolEligible:true,optOut:false,employeeContrib:'5',employerContrib:'3',provider:'Nest'},
  consent:{gdprPrivacy:true,disciplinary:true,grievance:true,equality:true,healthSafety:true,s1Statement:true,contractAccept:true},
  status:'complete',ts:now(),isDemo:true};
  state.starters.push(s1);await idbPut('starters',s1);
  await auditLog('demo.seeded',{reasoning:'first boot'});await persistUI()}

(async function boot(){try{await openDB();await loadAll();await seedDemo();initMesh();$('#tierBadge').textContent=state.settings.anthropicKey?'T3':'T0';render()}catch(e){console.error('[fallhronboard] boot error:',e);document.getElementById('view').innerHTML='<div class="empty">Boot error: '+esc(e.message)+'</div>'}})();
</script>
